name: Refresh board

on:
  # GitHub often starts scheduled runs hours late, so we don't count on any one of them.
  # Every 30 minutes from 7 AM ET onward, a run checks whether today's refresh has happened;
  # the first one after 8 AM New York time that finds it hasn't, does it.
  schedule:
    - cron: "7,37 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Refresh once a day, after 8 AM Eastern
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — skipping the time check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" -lt 8 ]; then
            echo "It's ${hour}:00 in New York, before 8 AM. Nothing to do yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(jq -r '.lastUpdated // empty' public/data.json 2>/dev/null || true)
          if [ -n "$last" ]; then
            last_day=$(TZ=America/New_York date -d "$last" +%F)
            last_hour=$(TZ=America/New_York date -d "$last" +%H)
            if [ "$last_day" = "$today" ] && [ "$last_hour" -ge 8 ]; then
              echo "Already refreshed today at ${last_hour}:00 New York time. Nothing to do."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull ads from Meta
        if: steps.guard.outputs.run == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: node sync.js

      - name: Commit data.json if it changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh board data"
            # Someone may have pushed site changes while the sync ran.
            git pull --rebase
            git push
          fi

  publish:
    needs: refresh
    if: needs.refresh.outputs.run == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
